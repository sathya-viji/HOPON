// ─────────────────────────────────────────────────────────────────────────────
// SECTION 12 — ROUTER
// go(), back(), goNav() are the only navigation entry points.
// _render() is private — never called directly from screens or components.
// ─────────────────────────────────────────────────────────────────────────────
function go(name) {
  STATE.history.push(STATE.screen);
  STATE.screen = name;
  _render(name);
  if (name === 'notifications') {
    setState({ ui:{ notifBadge:0 } });
    _updateNavBadge();
  }
}

function back() {
  const prev = STATE.history.pop() || 'home';
  STATE.screen = prev;
  _render(prev);
}

function goNav(name) {
  STATE.history = [];
  setState({ screen:name });
  _render(name);
  _updateNavIcons(name);
}

// Plan navigation helpers — set selected state, then route
function showPlan(planId) {
  setState({ selected:{ planId } });
  const plan = STATE.plans.find(p => p.id === planId);
  go(plan && plan.status === PLAN_STATUS.EXPIRED ? 'plan-expired' : 'plan');
}
function showPlanAsHost(planId) {
  setState({ selected:{ planId } });
  go('plan-host');
}
function showMoment(momentId) {
  setState({ selected:{ momentId } });
  go('recap-detail');
}

// Create sheet
function openCreatePicker() {
  setState({ ui:{ createPickerOpen:true } });
  _render(STATE.screen);
}

function closeCreatePicker() {
  setState({ ui:{ createPickerOpen:false } });
  _render(STATE.screen);
}

function openCreate() {
  setState({ ui:{ createOpen:true, createPickerOpen:false }, create:{ step:1 } });
  _render(STATE.screen);
}
function closeCreate() {
  setState({ ui:{ createOpen:false } });
  _render(STATE.screen);
}

function _activeNavItem() {
  const NAV = ['home','notifications','recaps','profile'];
  return NAV.includes(STATE.screen) ? STATE.screen : 'home';
}

function _render(name) {
  const fn  = SCREENS[name] || SCREENS['home'];
  const $s  = document.getElementById('screen');
  const $nb = document.getElementById('navBar');
  const $sb = document.getElementById('statusBar');

  $s.innerHTML = fn();
  $s.scrollTop = 0;

  // Nav visibility
  $nb.style.display = NO_NAV.has(name) ? 'none' : 'flex';
  // Status bar hides on splash
  $sb.style.display = name === 'splash' ? 'none' : 'flex';
  // Dark mode — class on #phone (CSS vars cascade) + body (shell bg)
  document.getElementById('phone').classList.toggle('dark', STATE.ui.darkMode);
  document.body.classList.toggle('dark-shell', STATE.ui.darkMode);

  _updateNavIcons(_activeNavItem());
  _updateNavBadge();

  // Append create sheet on top of current screen
  if (STATE.ui.createOpen) {
    $s.insertAdjacentHTML('beforeend', _renderCreateSheet());
  }

  // Append create picker on top of current screen
  if (STATE.ui.createPickerOpen) {
    $s.insertAdjacentHTML('beforeend', _renderCreatePicker());
  }

  startTicker();

  // Post-render hooks per screen
  if (name === 'signup-otp' || name === 'login') {
    setTimeout(() => {
      const inp = document.getElementById('otpInput') || document.getElementById('loginOtp');
      if (inp) inp.focus();
      const cells = document.getElementById('otpCells');
      if (cells) cells.onclick = () => { const i = document.getElementById('otpInput'); if(i) i.focus(); };
    }, 80);
  }

  // Map init hook — triggers whenever a screen renders with #hoponMap in it
  if (document.getElementById('hoponMap')) {
    requestAnimationFrame(initMap);
  }

  // Chat scroll-to-bottom on load
  if (name === 'chat') {
    requestAnimationFrame(() => {
      const sc = document.getElementById('chatScroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
    });
  }
}

function _updateNavIcons(active) {
  const ITEMS = [
    { id:'home',          icon:'home'  },
    { id:'notifications', icon:'bell'  },
    { id:'recaps',        icon:'image' },
    { id:'profile',       icon:'user'  },
  ];
  // ic() takes a color string — CSS vars can't be used as SVG stroke values.
  // Use the token hex values directly here; these are the only two nav states.
  const ON  = '#FF4D2E'; // = var(--coral) — intentional, unchanged in dark mode
  const OFF = '#B0B0B0'; // nav inactive — mid-grey, same in both modes
  ITEMS.forEach(({ id, icon }) => {
    const el = document.getElementById(`ni-${id}`);
    if (el) el.innerHTML = ic(icon, 22, id===active ? ON : OFF, id===active ? 2 : 1.75);
  });
}

function _updateNavBadge() {
  const el = document.getElementById('notifBadge');
  if (!el) return;
  const n = STATE.ui.notifBadge;
  el.textContent = n;
  el.style.display = n > 0 ? 'flex' : 'none';
}

        <button class="btn-secondary" style="width:auto;padding:14px 20px" onclick="crStep(-1)">← Edit</button>
        <div style="flex:1"><button class="btn-primary coral" onclick="crPostPlan()">Post plan →</button></div>
      </div>`,

  });
}

function crSearch(val) {
  setState({ ui:{ searchQuery:val, searchActive:true } });
  if (STATE.ui.viewMode === 'map') {
    // Map view: update pins without destroying/recreating Leaflet instance
    _render(STATE.screen);
    if (_MAP.instance) {
      // Remove existing plan pin layers and redraw with new filter
      _MAP.instance.eachLayer(layer => {
        if (layer._hoponPlanPin) _MAP.instance.removeLayer(layer);
      });
      _filterPlans(STATE.plans, STATE.ui).forEach(p => {
        if (!p.lat) return;
        const cat   = CAT[p.cat] || CAT['other'];
        const isNow = p.mins <= 15;
        const bg    = isNow ? '#FF4D2E' : '#0A0A0A';
        const time  = isNow ? 'NOW' : p.mins < 60 ? `${p.mins}m` : `${Math.floor(p.mins/60)}h`;
        const pin   = L.divIcon({
          className: '',
          html: `<div style="display:inline-flex;align-items:center;gap:5px;background:${bg};color:#fff;border-radius:20px;padding:5px 10px 5px 7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.25)">${ic(cat.icon,13,'#fff')}<span>${time}</span></div>`,
          iconSize: 'auto', iconAnchor: [0,16],
        });
        const marker = L.marker([p.lat, p.lng], { icon: pin })
          .addTo(_MAP.instance)
          .on('click', () => showMapCard(p.id));
        marker._hoponPlanPin = true;
      });
    }
  } else {
    _render(STATE.screen);
  }
}

function crSearchBlur()   { setState({ ui:{ searchActive:false } }); }

function crSetFilter(f)    { setState({ ui:{ filterAct:f } }); _render(STATE.screen); }
function crSetTimeFilter(f){ setState({ ui:{ filterTime:f } }); _render(STATE.screen); }
function crSetQuickFilter(f) {
  if (f === 'distance') {
    setState({ ui:{ sortMode:'distance', filterTime:'all' } });
  } else {
    setState({ ui:{ filterTime:f, sortMode:'time' } });
  }
  _render(STATE.screen);
}

function _filterPlans(plans, ui) {
  let result = plans.filter(p => {
    if (p.status === PLAN_STATUS.EXPIRED || p.mins < 0) return false;
    if (ui.filterAct !== 'All' && p.cat !== ui.filterAct) return false;
    if (ui.filterTime === 'now'   && p.mins > 15)  return false;
    if (ui.filterTime === 'later' && p.mins <= 15) return false;
    if (ui.searchQuery) {
      const q = ui.searchQuery.toLowerCase();
      if (!p.label.toLowerCase().includes(q) &&
          !p.where.toLowerCase().includes(q)  &&
          !p.host.toLowerCase().includes(q))   return false;
    }
    return true;
  });
  if (ui.sortMode === 'distance' && result.length) {
    // Sort by distance from user's approximate location (HSR Layout)
    const [ult, ulg] = [12.9352, 77.6245];
    result = result.slice().sort((a,b) => {
      const da = Math.hypot((a.lat||ult)-ult, (a.lng||ulg)-ulg);
      const db = Math.hypot((b.lat||ult)-ult, (b.lng||ulg)-ulg);
      return da - db;
    });
  }
  return result;
}

// ── Leaflet map ───────────────────────────────────────────────────────────────

const _MAP = { instance: null };

function initMap() {
  const el = document.getElementById('hoponMap');
  if (!el || !window.L) return;
  if (_MAP.instance) { _MAP.instance.remove(); _MAP.instance = null; }

  // #hoponMap is position:absolute;inset:0 — its offsetWidth/Height are always
  // concrete pixels. No kludges needed.
  _MAP.instance = L.map('hoponMap', {
    zoomControl: false,
    attributionControl: false,
  }).setView([12.9352, 77.6245], 14);

  // CartoDB Positron — clean minimal style, no API key required.
  // Switches to dark_all when dark mode is active.
  const isDark    = STATE.ui.darkMode;
  const tileStyle = isDark ? 'dark_all' : 'light_all';
  L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/rastertiles/${tileStyle}/{z}/{x}/{y}{r}.png`,
    { maxZoom:19, subdomains:'abcd' }
  ).addTo(_MAP.instance);

  // User location dot — pulsing blue
  L.marker([12.9352, 77.6245], {
    icon: L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:#4285F4;border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(66,133,244,0.22)"></div>`,
      iconSize: [14,14], iconAnchor: [7,7],
    }),
  }).addTo(_MAP.instance);

  // Plan pins — pill-shaped with label
  _filterPlans(STATE.plans, STATE.ui).forEach(p => {
    if (!p.lat) return;
    const cat   = CAT[p.cat] || CAT['other'];
    const isNow = p.mins <= 15;
    const bg    = isNow ? '#FF4D2E' : '#0A0A0A';
    const time  = isNow ? 'NOW' : p.mins < 60 ? `${p.mins}m` : `${Math.floor(p.mins/60)}h`;
    const pin   = L.divIcon({
      className: '',
      html: `<div style="display:inline-flex;align-items:center;gap:5px;background:${bg};color:#fff;border-radius:20px;padding:5px 10px 5px 7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.25);letter-spacing:0.01em">
        <span style="font-size:13px;line-height:1">${ic(cat.icon,13,'#fff')}</span>
        <span>${time}</span>
      </div>`,
      iconSize: 'auto',
      iconAnchor: [0, 16],
    });
    const marker = L.marker([p.lat, p.lng], { icon: pin })
      .addTo(_MAP.instance)
      .on('click', () => showMapCard(p.id));
    marker._hoponPlanPin = true;
  });

  // One rAF is sufficient — the container has absolute positioning so its
  // dimensions are already resolved when initMap is called post-render.
  requestAnimationFrame(() => {
    if (_MAP.instance) _MAP.instance.invalidateSize({ animate: false });
  });
}


function showMapCard(planId) {
  setState({ selected:{ planId } });
  const plan = STATE.plans.find(p=>p.id===planId);
  if (!plan) return;
  const card = document.getElementById('mapCard');
  const content = document.getElementById('mapCardContent');
  if (!card || !content) return;
  content.innerHTML = C.PlanRow({ plan, joined:STATE.session.joined[planId], requested:STATE.session.requested[planId] });
  card.classList.add('visible');
}

function dismissMapCard() {
  const card = document.getElementById('mapCard');
  if (card) card.classList.remove('visible');
}

function joinPlan(planId) {
  const plan = STATE.plans.find(p => p.id === planId);
  if (!plan) return;
  if (plan.type === PLAN_TYPE.OPEN) {
    plan.joiners = plan.joiners || [];
    plan.joiners.push(STATE.user.avatar);
    plan.spots = Math.max(0, (plan.spots || 1) - 1);
    setState({ session:{ joined:{ ...STATE.session.joined, [planId]:true }, _newJoinerIdx:{ [planId]: Math.min(plan.joiners.length-1, 3) } } });
    // Increment host's notification badge — they get notified of a new joiner
    setState({ ui:{ notifBadge: STATE.ui.notifBadge + 1 } });
    _updateNavBadge();
    go('plan-joined');
  } else {
    setState({ session:{ requested:{ ...STATE.session.requested, [planId]:true } } });
    // Host gets a request notification
    setState({ ui:{ notifBadge: STATE.ui.notifBadge + 1 } });
    _updateNavBadge();
    go('plan-requested');
  }
}

  setState({ selected:{ planId } });
  const j = { ...STATE.session.joined };
  delete j[planId];
  setState({ session:{ joined:j } });
  go('plan-leave-confirm');
}

function plSubmitEndorsements(planId) {
  const att      = STATE.session.attendance || {};
  const planAtt  = att[planId] || {};
  const showedUp = Object.values(planAtt).filter(Boolean).length;
  const total    = Object.keys(planAtt).length;
  // Update user's own attendance score based on their role (simplified for demo)
  // In production: server calculates from all plans
  if (total > 0) {
    const currentPct = STATE.user.attendance || 90;
    // Simulate score nudge — hosting a plan that filled well bumps score slightly
    const newPct = Math.min(100, Math.round(currentPct * 0.9 + (showedUp/total) * 100 * 0.1));
    setState({ user:{ attendance: newPct } });
  }
  toast(`Attendance marked · ${showedUp}/${total} showed up`);
  go('plan-ended');
}

function ntMarkAllRead() {
  const notifs = (STATE.session.notifications || SEED_NOTIF).map(n => ({...n, read:true}));
  setState({ session:{ notifications:notifs }, ui:{ notifBadge:0 } });
  _render('notifications');
}

function ntTap(id) {
  const notifs = (STATE.session.notifications || SEED_NOTIF).map(n =>
    n.id === id ? {...n, read:true} : n
  );
  setState({ session:{ notifications:notifs } });
  const n = notifs.find(n => n.id === id);
  if (!n) return;
  // Route to relevant screen
  if (n.type === 'join' || n.type === 'request') {
    setState({ selected:{ planId:n.planId } });
    go('plan-host');
  } else if (n.type === 'approved') {
    setState({ selected:{ planId:n.planId } });
    go('plan-approved');
  } else if (n.type === 'declined') {
    setState({ selected:{ planId:n.planId } });
    go('plan-declined');
  } else if (n.type === 'recap') {
    go('recaps');
  } else if (n.type === 'follow') {
    go('profile-other');
  } else if (n.type === 'ended') {
    setState({ selected:{ planId:n.planId } });
    go('endorse');
  } else {
    _render('notifications');
  }
}

function ntApprove(id) {
  const notifs = (STATE.session.notifications || SEED_NOTIF).map(n =>
    n.id === id ? {...n, read:true, action:null} : n
  );
  setState({ session:{ notifications:notifs } });

  _render('notifications');
}

function rpPost() {
  const draft = STATE.session.recapDraft || {};
  if (!draft.photo || !(draft.caption||'').trim()) return;
  // Add to MOMENTS
  const newMoment = {
    id:       STATE.moments.length,
    img:      draft.photo,
    familiar: false,
    minsAgo:  0,
    seen:     true,
    user:     STATE.user.handle.replace('@',''),
    name:     STATE.user.name,
    av:       STATE.user.avatar,
    planCount:STATE.user.plansJoined,
    metCount: STATE.user.peopleMet,
    caption:  draft.caption,
    plan:     draft.planId != null ? (STATE.plans.find(p=>p.id===draft.planId)||{}).label : null,
    loc:      STATE.user.neighbourhood,
    likes:    0,
    commentCount: 0,
    planId:   draft.planId || null,
  };
  STATE.moments.unshift(newMoment);
  setState({ session:{ recapDraft:{} } });
  go('recap-posted');
}

function rpPostComment(momentId) {
  const text = (STATE.session.commentDraft||'').trim();
  if (!text) return;
  const existing = STATE.session.recapComments || { ...SEED_COMMENTS };
  const newComment = {
    id:      (existing[momentId]||[]).length,
    av:      STATE.user.avatar,
    name:    STATE.user.name,
    handle:  STATE.user.handle,
    text,
    minsAgo: 0,
    likes:   0,
  };
  existing[momentId] = [...(existing[momentId]||[]), newComment];
  // Increment comment count on moment
  const idx = STATE.moments.findIndex(m => m.id === momentId);
  if (idx !== -1) STATE.moments[idx].commentCount++;
  setState({ session:{ recapComments:existing, commentDraft:'' } });
  _render('recap-comments');
  requestAnimationFrame(() => {
    const sc = document.querySelector('#screen .scroll');
    if (sc) sc.scrollTop = sc.scrollHeight;
  });
}

  if (phone) phone.classList.toggle('dark', next);

// SECTION 15 — LIVE TICKER
// Polls every second. Updates all .countdown[data-planid] spans.
// Uses an object (_TICKER) instead of a let to avoid stray mutable globals.
// ─────────────────────────────────────────────────────────────────────────────
const _TICKER_START = Date.now();
const _TICKER = { handle: null };

function startTicker() {
  if (_TICKER.handle) clearInterval(_TICKER.handle);
  _tick();
  _TICKER.handle = setInterval(_tick, 1000);
}

function _tick() {
  const elapsed = Math.floor((Date.now() - _TICKER_START) / 1000);
  document.querySelectorAll('.cd[data-planid]').forEach(span => {
    const origMins = parseInt(span.getAttribute('data-mins'), 10);
    const remSecs  = Math.max(0, origMins * 60 - elapsed);
    const { text, urgency } = tickerText(remSecs);
    // Only flash when the displayed value actually changes
    if (span.textContent !== text) {
      span.textContent = text;
      span.className = urgency===URGENCY.NOW ? 'cd cd-now' : urgency===URGENCY.SOON ? 'cd cd-soon' : 'cd cd-later';
      // Trigger digit flash — remove and re-add class to restart animation
      span.classList.remove('cd-flash');
      void span.offsetWidth; // force reflow so animation restarts
      span.classList.add('cd-flash');
    }
  });
}

function startClock() {
  function tick() {
    const el = document.getElementById('statusTime');
    if (el) el.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  tick();
  setInterval(tick, 10000);
}
